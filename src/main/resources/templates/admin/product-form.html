<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? 'Редактирование товара' : 'Создание товара'">Форма</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/products}">Поиск товаров</a>
        <a th:href="@{/admin/users}">Пользователи</a>
        <a th:href="@{/admin/products}">Управление товарами</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Мой профиль</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout"><button type="submit">Выйти</button></form>
    </nav>
    <h1 th:text="${isEdit} ? 'Редактирование товара' : 'Создание товара'">Форма</h1>
    <p class="error" th:if="${error}" th:text="${error}">Ошибка</p>
    <form class="entity-form" th:action="@{/admin/products/save}" th:object="${productForm}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="form-field"><label for="name">Название</label><input id="name" type="text" th:field="*{name}" required><p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div>
        <div class="form-field"><label for="price">Цена</label><input id="price" type="number" min="0.01" step="0.01" th:field="*{price}" required><p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p></div>
        <div class="form-field"><label for="description">Описание</label><textarea id="description" rows="3" th:field="*{description}"></textarea></div>
        <div class="form-field"><label for="stockQuantity">Количество на складе</label><input id="stockQuantity" type="number" min="0" step="1" th:field="*{stockQuantity}" required><p class="error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></p></div>
        <div class="form-actions">
            <button type="submit" th:text="${isEdit} ? 'Сохранить изменения' : 'Создать'">Сохранить</button>
            <a th:href="@{/admin/products}">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
