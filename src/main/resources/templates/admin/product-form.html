<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Редактирование товара' : 'Создание товара'">Товар</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">Главная</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Профиль</a>
        <a th:href="@{/admin/products}">Назад к списку</a>
    </nav>

    <h1 th:text="${isEdit} ? 'Редактирование товара' : 'Создание товара'">Товар</h1>

    <p class="error" th:if="${error}" th:text="${error}">Ошибка</p>

    <form th:action="${isEdit} ? @{/admin/products/{id}(id=${productForm.id})} : @{/admin/products}"
          th:object="${productForm}" method="post">

        <label>Название:</label><br>
        <input type="text" th:field="*{name}" required>
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label>Цена:</label><br>
        <input type="number" step="0.01" th:field="*{price}" required>
        <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

        <label>Описание:</label><br>
        <input type="text" th:field="*{description}"><br>

        <label>Количество на складе:</label><br>
        <input type="number" th:field="*{stockQuantity}" required>
        <p class="error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></p>

        <input type="submit" th:value="${isEdit} ? 'Сохранить' : 'Создать'">
        <a th:href="@{/admin/products}">Отмена</a>
    </form>
</div>
</body>
</html>
