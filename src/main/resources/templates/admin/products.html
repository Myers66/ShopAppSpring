<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление товарами</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/products}">Поиск товаров</a>
        <a th:href="@{/admin/users}">Пользователи</a>
        <a th:href="@{/admin/products}">Управление товарами</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Мой профиль</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout"><button type="submit">Выйти</button></form>
    </nav>
    <h1>Управление товарами</h1>
    <p><a th:href="@{/admin/products/new}">➕ Добавить товар</a> · <a th:href="@{/products}">Перейти к поиску товаров</a></p>
    <p th:if="${#lists.isEmpty(products)}">Пока нет товаров. Создайте первый товар, чтобы проверить поиск.</p>
    <div class="table-scroll" th:unless="${#lists.isEmpty(products)}">
        <table>
            <thead><tr><th>ID</th><th>Название</th><th>Цена</th><th>Остаток</th><th>Описание</th><th>Действия</th></tr></thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Ноутбук</td>
                <td th:text="${product.price} + ' руб.'">0 руб.</td>
                <td th:text="${product.stockQuantity}">0</td>
                <td th:text="${product.description}">Описание</td>
                <td>
                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">Редактировать</a>
                    <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" class="inline-form">
                        <button type="submit" class="btn-danger" onclick="return confirm('Удалить товар?')">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
