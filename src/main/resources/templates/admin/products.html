<table th:unless="${#lists.isEmpty(products)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Цена</th>
        <th>Остаток</th>
        <th>Описание</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}">1</td>
        <td th:text="${product.name}">Ноутбук</td>
        <td th:text="${product.price} + ' руб.'">0 руб.</td>
        <td th:text="${product.stockQuantity}">0</td>
        <td th:text="${product.description}">Описание</td>
        <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Профиль</a>
        <td>
            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">Редактировать</a>
            <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" style="display:inline">
                <button type="submit" class="btn-danger"
                        onclick="return confirm('Удалить товар?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
