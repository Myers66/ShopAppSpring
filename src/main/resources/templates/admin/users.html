<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/products}">Товары</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Пользователи</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Админ: товары</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Профиль</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout"><button type="submit">Выйти</button></form>
    </nav>

    <h1>Управление пользователями</h1>
    <p><a th:href="@{/admin/users/new}">➕ Создать пользователя</a></p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>Роль</th>
            <th>Полное имя</th>
            <th>Дата создания</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">admin</td>
            <td th:text="${user.role}">ADMIN</td>
            <td th:text="${user.fullName}">Администратор</td>
            <td th:text="${user.createdAt}">2026-01-01</td>
            <td>
                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}">Редактировать</a>
                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn-danger"
                            onclick="return confirm('Удалить пользователя?')">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
