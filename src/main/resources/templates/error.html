<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${errorTitle} ?: 'Ошибка'">Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container error-page">
    <p class="error-code" th:text="${errorCode} ?: '500'">500</p>
    <h2 th:text="${errorTitle} ?: 'Ошибка'">Ошибка</h2>
    <p th:text="${errorMessage} ?: 'Что-то пошло не так.'">Что-то пошло не так.</p>

    <a th:href="@{/}" class="btn-home">← На главную</a>
</div>
</body>
</html>
