<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ShopApp — Главная</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/products}">Товары</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Пользователи</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Админ: товары</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/logout}">Выйти</a>
    </nav>

    <h1>Добро пожаловать в ShopApp!</h1>
    <p>Это учебное приложение для управления товарами и пользователями.</p>

    <p><a th:href="@{/products}" style="font-size:18px;">→ Перейти к списку товаров</a></p>

    <h2>Последние товары</h2>
    <p th:if="${#lists.isEmpty(products)}">Товаров пока нет.</p>
    <ul th:unless="${#lists.isEmpty(products)}">
        <li th:each="product : ${products}">
            <strong th:text="${product.name}">Название</strong> —
            <span th:text="${product.price} + ' руб.'">0 руб.</span>
            (остаток: <span th:text="${product.stockQuantity}">0</span>)
        </li>
    </ul>
</div>
</body>
</html>
