<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Товары</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/products}">Товары</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Пользователи</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Админ: товары</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Профиль</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/logout}">Выйти</a>
    </nav>

    <h1>Список товаров</h1>

    <!-- Форма поиска -->
    <form th:action="@{/products}" method="get" class="search-form">
        <div class="row">
            <div>
                <label>Название:</label><br>
                <input type="text" name="name" th:value="${searchName}" placeholder="Поиск по названию">
            </div>
            <div>
                <label>Цена от:</label><br>
                <input type="number" step="0.01" name="min" th:value="${searchMin}" placeholder="0">
            </div>
            <div>
                <label>Цена до:</label><br>
                <input type="number" step="0.01" name="max" th:value="${searchMax}" placeholder="∞">
            </div>
            <div>
                <input type="submit" value="🔍 Найти">
                <a th:href="@{/products}" style="margin-left:10px;">Сбросить</a>
            </div>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(products)}">Товары не найдены.</p>

    <div th:unless="${#lists.isEmpty(products)}">
        <div th:each="product : ${products}" class="product-card">
            <h3 th:text="${product.name}">Название</h3>
            <p><strong>Цена:</strong> <span th:text="${product.price} + ' руб.'">0 руб.</span></p>
            <p><strong>В наличии:</strong> <span th:text="${product.stockQuantity}">0</span> шт.</p>
            <p th:if="${product.description != null && !product.description.isEmpty()}">
                <em th:text="${product.description}">Описание</em>
            </p>
        </div>
    </div>
</div>
</body>
</html>
