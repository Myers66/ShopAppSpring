<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Регистрация</h2>
    <p class="error" th:if="${error}" th:text="${error}">Ошибка</p>
    <form class="entity-form auth-form" th:action="@{/register}" th:object="${userForm}" method="post">
        <div class="form-field">
            <label for="username">Логин:</label>
            <input id="username" type="text" th:field="*{username}" autocomplete="username" required>
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="form-field">
            <label for="password">Пароль:</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="form-field">
            <label for="fullName">Полное имя:</label>
            <input id="fullName" type="text" th:field="*{fullName}" autocomplete="name">
        </div>
        <div class="form-actions"><button type="submit">Зарегистрироваться</button></div>
    </form>
    <p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</div>
</body>
</html>
